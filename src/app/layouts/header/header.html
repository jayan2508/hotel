<header>
  <div class="header-container">
    <div class="left-content">
      <h1 class="black header-title">{{ headerService.headerTitle() }}</h1>
      <p class="gray sub-title">{{ date }} • {{ time }} • {{ greeting }}, Sardar sir</p>
    </div>

    <!-- <div>
      <label for="search" class="search-label">
        <input class="search-input" id="search" type="text" />
      </label>
      <app-button icon="bell" buttonClass="gray-icon"> </app-button>
    </div> -->

    <div class="right-content">
      <button class="notification-button"><span class="icon icon-bell" alt=""> </span></button>
      <ul class="theme-toggle">
        @for (item of themeData; track item.id) {
          <li
            [ngClass]="{
              active: item.value === selectedTheme,
            }"
            (click)="toggleTheme(item.value)"
          >
            <img
              [src]="item.value === selectedTheme ? item.activeIcon : item.inactiveIcon"
              alt=""
            />
          </li>
        }
      </ul>
      <button class="add-employee-button">
        <span class="icon icon-plus" alt=""></span>Add Employee
      </button>
    </div>
  </div>
</header>
